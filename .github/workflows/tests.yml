name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # Each lab is run from its own folder so `import <lab>` resolves the same
      # way it does locally (the labs are stdlib-only; only pytest is needed).
      - name: gift_card_lab
        working-directory: gift_card_lab
        run: python -m pytest -q

      - name: ddos_lab
        working-directory: ddos_lab
        run: python -m pytest -q

      - name: amplification_lab
        working-directory: amplification_lab
        run: python -m pytest -q

      - name: web_attack_lab
        working-directory: web_attack_lab
        run: python -m pytest -q
